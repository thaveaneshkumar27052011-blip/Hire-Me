<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: 40px auto;
      background-color: #f4f6f9;
    }
    .form-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      font-weight: bold;
      font-size: 14px;
      color: #555;
    }
    input, textarea, button {
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Submit Information</h2>

    <form id="infoForm" action="https://formsubmit.co/thaveaneshkumar27052011@gmail.com" method="POST">
      
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New Website Form Submission!">

      <label for="org_name">Name of the Organisation:</label>
      <input type="text" id="org_name" name="organisation_name" placeholder="Acme Corp" required>

      <label for="email">Company Email Address:</label>
      <input type="email" id="email" name="email" placeholder="contact@company.com" required>

      <label for="address">Company Address:</label>
      <input type="text" id="address" name="address" placeholder="123 Business Street" required>

      <label for="details">For what purpose will you use my services/info?:</label>
      <textarea id="details" name="purpose" rows="4" placeholder="Type details here..." required></textarea>

      <button type="submit" id="submitBtn">Send Information</button>
    </form>

    <div id="status-message"></div>
  </div>

  <script>
    const form = document.getElementById('infoForm');
    const statusMsg = document.getElementById('status-message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault(); // Stop page refresh
      
      submitBtn.innerText = "Sending...";
      submitBtn.disabled = true;

      const formData = new FormData(form);

      fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      })
      .then(response => {
        if (response.ok) {
          statusMsg.className = 'success';
          statusMsg.innerText = "Message sent successfully! Check your inbox.";
          statusMsg.style.display = 'block';
          form.reset();
        } else {
          throw new Error('Submission failed');
        }
      })
      .catch(error => {
        statusMsg.className = 'error';
        statusMsg.innerText = "Notice: Check your email (including Spam) to activate FormSubmit on your first attempt!";
        statusMsg.style.display = 'block';
      })
      .finally(() => {
        submitBtn.innerText = "Send Information";
        submitBtn.disabled = false;
      });
    });
  </script>

</body>
</html>
